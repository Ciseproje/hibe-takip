name: Hibe Takip

on:
  schedule:
    - cron: "0 5 * * *"    # her gun 08:00 (Istanbul)
    - cron: "0 6 * * 1"    # pazartesi 09:00 haftalik ozet
  workflow_dispatch:
    inputs:
      mode:
        description: "daily veya weekly"
        default: "daily"

concurrency: hibe-takip

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calistir
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 6 * * 1' && 'weekly' || 'daily') }}
        run: python monitor.py "$MODE"
      - name: Durumu kaydet
        run: |
          git config user.name "hibe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state guncelle" && git push)
